server_tokens off;
limit_req_zone $binary_remote_addr zone=login:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
server {
  listen 8080;
  # Detrás de Traefik (Coolify): el par TCP es el contenedor de Traefik, no el visitante.
  # Sin esto, la allowlist por IP bloquea a TODOS (bug del primer despliegue en vivo).
  # Solo se confía en X-Forwarded-For cuando el par es una red privada Docker,
  # que es el único origen posible: el frontend ya no publica puerto en el host.
  set_real_ip_from 10.0.0.0/8;
  set_real_ip_from 172.16.0.0/12;
  set_real_ip_from 192.168.0.0/16;
  # Rangos de Cloudflare (cuando el DNS va con proxy/nube naranja, el visitante
  # real viene tras un borde de Cloudflare; sin esto la allowlist ve la IP de
  # Cloudflare y devuelve 403 a todos — bug de la demo academia, 3 nov 2026).
  set_real_ip_from 173.245.48.0/20;
  set_real_ip_from 103.21.244.0/22;
  set_real_ip_from 103.22.200.0/22;
  set_real_ip_from 103.31.4.0/22;
  set_real_ip_from 141.101.64.0/18;
  set_real_ip_from 108.162.192.0/18;
  set_real_ip_from 190.93.240.0/20;
  set_real_ip_from 188.114.96.0/20;
  set_real_ip_from 197.234.240.0/22;
  set_real_ip_from 198.41.128.0/17;
  set_real_ip_from 162.158.0.0/15;
  set_real_ip_from 104.16.0.0/13;
  set_real_ip_from 104.24.0.0/14;
  set_real_ip_from 172.64.0.0/13;
  set_real_ip_from 131.0.72.0/22;
  set_real_ip_from 2400:cb00::/32;
  set_real_ip_from 2606:4700::/32;
  set_real_ip_from 2803:f800::/32;
  set_real_ip_from 2405:b500::/32;
  set_real_ip_from 2405:8100::/32;
  set_real_ip_from 2a06:98c0::/29;
  set_real_ip_from 2c0f:f248::/32;
  real_ip_header X-Forwarded-For;
  real_ip_recursive on;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  client_max_body_size 2048m;

  # Headers de seguridad en TODAS las respuestas
  add_header X-Frame-Options "DENY" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "same-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'" always;

  # allowlist.conf se incluye por ubicación: /etc/nginx/allowlist.conf define allow/deny a nivel server vía include en location /
  location / {
    include /etc/nginx/allowlist.conf;
    try_files $uri $uri/ /index.html;
  }
  location /api/auth/token/ {
    include /etc/nginx/allowlist.conf;
    limit_req zone=login burst=3 nodelay;
    proxy_pass http://backend:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
  location /api/ {
    include /etc/nginx/allowlist.conf;
    limit_req zone=api burst=20 nodelay;
    proxy_pass http://backend:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
  location /health/ {
    access_log off;
    proxy_pass http://backend:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }
  # Admin de Django y docs de la API: NO pasan por el frontend público.
  # Se accede solo desde la red interna / terminal de Coolify.
  location /admin/ { return 404; }
  location /api/docs/ { include /etc/nginx/allowlist.conf; proxy_pass http://backend:8000; proxy_set_header Host $host; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto $scheme; }
  location ~ /\. { deny all; }
}
