# Academia (white-label) — Demo en Coolify, sin repo git.
# Las imágenes se construyen con dockerfile_inline: descargan el zip del código,
# verifican su SHA-256 y lo extraen. El zip lleva la carpeta raíz «appcode/».
# Variables requeridas en Coolify: DJANGO_SECRET_KEY, DJANGO_ALLOWED_HOSTS,
# CSRF_TRUSTED_ORIGINS, ALLOWED_IPS, CODE_URL, CODE_SHA256,
# DJANGO_SUPERUSER_USERNAME, DJANGO_SUPERUSER_EMAIL, DJANGO_SUPERUSER_PASSWORD
services:
  backend:
    build:
      context: .
      args:
        CODE_URL: ${CODE_URL:?Define CODE_URL en Coolify}
        CODE_SHA256: ${CODE_SHA256:?Define CODE_SHA256 en Coolify}
      dockerfile_inline: |
        FROM python:3.13-slim-bookworm
        ARG CODE_URL
        ARG CODE_SHA256
        ENV PYTHONDONTWRITEBYTECODE=1 PYTHONUNBUFFERED=1 PIP_NO_CACHE_DIR=1 CODE_URL=$CODE_URL CODE_SHA256=$CODE_SHA256
        WORKDIR /app
        RUN python -c "import urllib.request,hashlib,zipfile; urllib.request.urlretrieve(__import__('os').environ['CODE_URL'],'/tmp/code.zip'); h=hashlib.sha256(open('/tmp/code.zip','rb').read()).hexdigest(); assert h==__import__('os').environ['CODE_SHA256'], 'SHA256 mismatch: '+h; zipfile.ZipFile('/tmp/code.zip').extractall('/app')"
        RUN pip install --no-cache-dir -r /app/appcode/backend/requirements.txt && addgroup --system app && adduser --system --ingroup app app && mkdir -p /app/data /app/media_private /app/appcode/backend/staticfiles && chown -R app:app /app
        WORKDIR /app/appcode/backend
        USER app
        EXPOSE 8000
        CMD ["sh","-c","python manage.py migrate --noinput && python manage.py seed_demo && python manage.py collectstatic --noinput && (python manage.py createsuperuser --noinput || true) && exec gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 2 --threads 4 --timeout 600 --max-requests 1000 --max-requests-jitter 100"]
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?Define DJANGO_SECRET_KEY en Coolify}
      DJANGO_DEBUG: "False"
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:?Define DJANGO_ALLOWED_HOSTS en Coolify}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
      ALLOWED_IPS: ${ALLOWED_IPS:-}
      TIME_ZONE: America/El_Salvador
      DATA_DIR: /app/data
      MEDIA_ROOT: /app/media_private
      DJANGO_SUPERUSER_USERNAME: ${DJANGO_SUPERUSER_USERNAME:-}
      DJANGO_SUPERUSER_EMAIL: ${DJANGO_SUPERUSER_EMAIL:-}
      DJANGO_SUPERUSER_PASSWORD: ${DJANGO_SUPERUSER_PASSWORD:-}
    volumes:
      - academia_data:/app/data
      - academia_media:/app/media_private
    expose:
      - "8000"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped
    healthcheck:
      test: ["CMD","python","-c","import urllib.request; urllib.request.urlopen('http://localhost:8000/health/')"]
      interval: 30s
      timeout: 5s
      retries: 3
  frontend:
    build:
      context: .
      args:
        CODE_URL: ${CODE_URL:?Define CODE_URL en Coolify}
        CODE_SHA256: ${CODE_SHA256:?Define CODE_SHA256 en Coolify}
      dockerfile_inline: |
        FROM node:24-alpine AS build
        ARG CODE_URL
        ARG CODE_SHA256
        ENV CODE_URL=$CODE_URL CODE_SHA256=$CODE_SHA256 VITE_API_BASE_URL=/api
        RUN wget -q "$CODE_URL" -O /tmp/code.zip && echo "$CODE_SHA256  /tmp/code.zip" | sha256sum -c - && unzip -q /tmp/code.zip -d /src && cd /src/appcode/frontend && npm ci --no-audit --no-fund && npm run build
        FROM nginx:alpine
        RUN rm -f /etc/nginx/conf.d/default.conf
        COPY --from=build /src/appcode/frontend/dist /usr/share/nginx/html
        COPY --from=build /src/appcode/frontend/nginx.conf /etc/nginx/conf.d/default.conf
        COPY --from=build /src/appcode/frontend/docker-entrypoint-lms.sh /docker-entrypoint-lms.sh
        RUN chmod +x /docker-entrypoint-lms.sh && echo "allow all;" > /etc/nginx/allowlist.conf
        EXPOSE 8080
        CMD ["/docker-entrypoint-lms.sh"]
    environment:
      ALLOWED_IPS: ${ALLOWED_IPS:-}
    depends_on:
      - backend
    expose:
      - "8080"
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
volumes:
  academia_data:
  academia_media:
